version: "3.9"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rede_trade}
      POSTGRES_USER: ${POSTGRES_USER:-rede_trade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque_esta_senha}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rede_trade} -d ${POSTGRES_DB:-rede_trade}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rede_trade_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3024
      DATABASE_URL: postgresql://${POSTGRES_USER:-rede_trade}:${POSTGRES_PASSWORD:-troque_esta_senha}@db:5432/${POSTGRES_DB:-rede_trade}?schema=public
      SECRET: ${SECRET:-troque_esta_chave}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.seudominio.com.br}
      MAILUSER: ${MAILUSER:-}
      MAILPASS: ${MAILPASS:-}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "${API_PORT:-3024}:3024"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3024/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - rede_trade_net

  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
    ports:
      - "${PGADMIN_PORT:-8080}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - rede_trade_net

volumes:
  postgres_data:
  uploads_data:
  pgadmin_data:

networks:
  rede_trade_net:
    driver: bridge
